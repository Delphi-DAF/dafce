format:
  html:
    theme:
      light: zephyr
      dark: cyborg
    css: custom.css
    highlight-style: github
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    include-after-body: _partials/lang-toggle.html

